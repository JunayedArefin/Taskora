name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web assets
        run: |
          npm install
          npm run build

      - name: Add and sync Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*dpi; do
            if [ -d "$dir" ]; then
              cp public/assets/Taskora_Icon.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp public/assets/Taskora_Icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp public/assets/Taskora_Icon.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          sed -i 's/versionCode 1/versionCode 2/g' app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "2.0"/g' app/build.gradle || true
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Taskora.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Taskora-v2.0.0.apk

      - name: Upload Taskora.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taskora-apk
          path: Taskora.apk

      - name: Publish APK to GitHub Releases & Update Repo Taskora.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Taskora.apk
          git commit -m "Auto-update compiled Taskora.apk [skip ci]" || true
          git push origin HEAD:main || true
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          gh release create v1.0.0 Taskora.apk Taskora-v2.0.0.apk --title "Taskora Android APK (Latest)" --notes "Latest installable Android APK for Taskora."
          gh release delete v2.0.0 --yes || true
          git tag -d v2.0.0 || true
          gh release create v2.0.0 Taskora.apk Taskora-v2.0.0.apk --title "Taskora v2.0.0 Android APK (Latest)" --notes "Latest updated Android APK for Taskora with Subscription, Daily Repeat, Edit Task, and Consistency Grid."
